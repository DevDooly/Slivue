name: Android Device Matrix

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 5'

permissions:
  contents: read

concurrency:
  group: android-device-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-test:
    name: API ${{ matrix.api-level }} 계측 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 31
            task: pixel2Api31DebugAndroidTest
          - api-level: 34
            task: pixel2Api34DebugAndroidTest
          - api-level: 35
            task: pixel2Api35DebugAndroidTest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm

      - name: Run Managed Device Test
        run: ./gradlew "${{ matrix.task }}" --no-daemon

  legacy-api-26-test:
    name: API 26 계측 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Create and Start API 26 Emulator
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$SDKMANAGER" --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-26;default;x86_64"
          echo "no" | "$AVDMANAGER" create avd --force \
            --name notification-edge-api26 \
            --package "system-images;android-26;default;x86_64" \
            --device "pixel_2" \
            --path "$ANDROID_AVD_HOME/notification-edge-api26.avd"
          test -f "$ANDROID_AVD_HOME/notification-edge-api26.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" \
            -avd notification-edge-api26 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator-api26.log" 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          timeout 180 "$ADB" wait-for-device
          BOOT_COMPLETED=""
          for attempt in {1..60}; do
            BOOT_COMPLETED="$("$ADB" shell getprop sys.boot_completed | tr -d '\r')"
            if [[ "$BOOT_COMPLETED" == "1" ]]; then
              break
            fi
            sleep 5
          done
          test "$BOOT_COMPLETED" = "1"
          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0

      - name: Run API 26 Test
        run: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Stop API 26 Emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true
          if [[ -n "${EMULATOR_PID:-}" ]]; then
            kill "$EMULATOR_PID" || true
          fi
          tail -n 200 "$RUNNER_TEMP/emulator-api26.log" || true
