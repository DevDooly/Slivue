name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test & Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_STORE_PASSWORD: ${{ secrets.LEGACY_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.LEGACY_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.LEGACY_RELEASE_KEY_PASSWORD }}
      ROTATED_RELEASE_STORE_PASSWORD: ${{ secrets.ROTATED_RELEASE_STORE_PASSWORD }}
      ROTATED_RELEASE_KEY_ALIAS: ${{ secrets.ROTATED_RELEASE_KEY_ALIAS }}
      ROTATED_RELEASE_KEY_PASSWORD: ${{ secrets.ROTATED_RELEASE_KEY_PASSWORD }}
      LEGACY_RELEASE_CERT_SHA256: ${{ secrets.LEGACY_RELEASE_CERT_SHA256 }}
      ROTATED_RELEASE_CERT_SHA256: ${{ secrets.ROTATED_RELEASE_CERT_SHA256 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & Build Cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Restore Release Signing Materials
        env:
          LEGACY_RELEASE_KEYSTORE_BASE64: ${{ secrets.LEGACY_RELEASE_KEYSTORE_BASE64 }}
          ROTATED_RELEASE_KEYSTORE_BASE64: ${{ secrets.ROTATED_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
        run: |
          test -n "$LEGACY_RELEASE_KEYSTORE_BASE64"
          test -n "$ROTATED_RELEASE_KEYSTORE_BASE64"
          test -n "$SIGNING_LINEAGE_BASE64"
          LEGACY_KEYSTORE_PATH="$RUNNER_TEMP/notification-edge-legacy.keystore"
          ROTATED_KEYSTORE_PATH="$RUNNER_TEMP/notification-edge-rotated.jks"
          LINEAGE_PATH="$RUNNER_TEMP/notification-edge-signing-lineage.bin"
          printf '%s' "$LEGACY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$LEGACY_KEYSTORE_PATH"
          printf '%s' "$ROTATED_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ROTATED_KEYSTORE_PATH"
          printf '%s' "$SIGNING_LINEAGE_BASE64" | base64 --decode > "$LINEAGE_PATH"
          chmod 600 "$LEGACY_KEYSTORE_PATH" "$ROTATED_KEYSTORE_PATH" "$LINEAGE_PATH"
          echo "RELEASE_STORE_FILE=$LEGACY_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ROTATED_RELEASE_STORE_FILE=$ROTATED_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_LINEAGE_FILE=$LINEAGE_PATH" >> "$GITHUB_ENV"

      - name: Verify Tag Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"
          test "v${VERSION_NAME}" = "$GITHUB_REF_NAME"

      - name: Run Tests and Build Release APK
        run: ./gradlew testDebugUnitTest compileDebugKotlin assembleDebugAndroidTest lintRelease assembleRelease assembleMinifiedRelease --no-daemon

      - name: Apply Rotated Signing Lineage
        run: |
          chmod +x scripts/sign-rotated-apk.sh
          scripts/sign-rotated-apk.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/minifiedRelease/app-minifiedRelease.apk

      - name: Prepare APK Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/app-release.apk release_assets/Slivue-candidate.apk
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/Slivue-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/apk/release/app-release.apk release_assets/Slivue.apk
            sha256sum "release_assets/Slivue-${GITHUB_REF_NAME}.apk" > "release_assets/Slivue-${GITHUB_REF_NAME}.apk.sha256"
            sha256sum release_assets/Slivue.apk > release_assets/Slivue.apk.sha256
          fi

      - name: Upload Release Candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slivue-release-${{ github.run_id }}
          path: release_assets/
          if-no-files-found: error
          retention-days: 7

  upgrade-compatibility:
    name: API ${{ matrix.api-level }} 서명키 교체 업데이트 검증
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            image-source: default
          - api-level: 35
            image-source: google_apis

    steps:
      - name: Download Release Candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slivue-release-${{ github.run_id }}
          path: release_assets

      - name: Download Previous Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG="$(gh api repos/${GITHUB_REPOSITORY}/releases \
            --jq ".[] | select(.draft == false and .tag_name != \"${GITHUB_REF_NAME}\") | .tag_name" \
            | head -n 1)"
          test -n "$PREVIOUS_TAG"
          PREVIOUS_ASSET="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PREVIOUS_TAG}" \
            --jq '[.assets[].name] | if index("Slivue.apk") then "Slivue.apk" elif index("NotificationEdge.apk") then "NotificationEdge.apk" else empty end')"
          test -n "$PREVIOUS_ASSET"
          echo "PREVIOUS_ASSET=$PREVIOUS_ASSET" >> "$GITHUB_ENV"
          mkdir -p previous_release
          gh release download "$PREVIOUS_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$PREVIOUS_ASSET" \
            --dir previous_release

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Create and Start Emulator
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          ADB="$ANDROID_HOME/platform-tools/adb"
          API_LEVEL="${{ matrix.api-level }}"
          IMAGE="system-images;android-${API_LEVEL};${{ matrix.image-source }};x86_64"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$SDKMANAGER" --install platform-tools emulator "$IMAGE"
          echo no | "$AVDMANAGER" create avd --force \
            --name notification-edge-upgrade \
            --package "$IMAGE" \
            --device pixel_2 \
            --path "$ANDROID_AVD_HOME/notification-edge-upgrade.avd"
          "$ANDROID_HOME/emulator/emulator" \
            -avd notification-edge-upgrade \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator-upgrade.log" 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          timeout 180 "$ADB" wait-for-device
          BOOT_COMPLETED=""
          for attempt in {1..60}; do
            BOOT_COMPLETED="$("$ADB" shell getprop sys.boot_completed | tr -d '\r')"
            if [[ "$BOOT_COMPLETED" == 1 ]]; then
              break
            fi
            sleep 5
          done
          test "$BOOT_COMPLETED" = 1

      - name: Verify In-place Upgrade
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          PACKAGE_NAME="com.devdooly.notificationedge"
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          package_uid() {
            local uid
            uid="$("$ADB" shell cmd package list packages -U "$PACKAGE_NAME" \
              | tr -d '\r' \
              | sed -nE 's/.*uid:([0-9]+).*/\1/p' \
              | head -n 1)"
            if [[ -z "$uid" ]]; then
              uid="$("$ADB" shell dumpsys package "$PACKAGE_NAME" \
                | tr -d '\r' \
                | sed -nE 's/^[[:space:]]*userId=([0-9]+).*/\1/p' \
                | head -n 1)"
            fi
            printf '%s' "$uid"
          }
          "$ADB" install "previous_release/$PREVIOUS_ASSET"
          OLD_UID="$(package_uid)"
          test -n "$OLD_UID"
          "$ADB" install -r release_assets/Slivue-candidate.apk
          NEW_UID="$(package_uid)"
          test "$NEW_UID" = "$OLD_UID"
          "$ADB" shell dumpsys package "$PACKAGE_NAME" \
            | tr -d '\r' \
            | grep -Fq "versionName=${EXPECTED_VERSION}"

      - name: Stop Emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true
          if [[ -n "${EMULATOR_PID:-}" ]]; then
            kill "$EMULATOR_PID" || true
          fi
          tail -n 200 "$RUNNER_TEMP/emulator-upgrade.log" || true

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify
      - upgrade-compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Release Asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slivue-release-${{ github.run_id }}
          path: release_assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Slivue ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/Slivue.apk
            release_assets/Slivue.apk.sha256
            release_assets/Slivue-${{ github.ref_name }}.apk
            release_assets/Slivue-${{ github.ref_name }}.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
